<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Shinobi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link href="/css/style.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-moon-stars-fill me-2"></i>Shinobi</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/showcase.html">Bootstrap Showcase</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 ms-lg-3 mt-2 mt-lg-0">
          <span id="userAvatar" role="img"></span>
          <button class="btn btn-outline-light btn-sm" type="button" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
            <i class="bi bi-circle-half"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container d-flex align-items-center py-5">
    <div class="w-100 text-center not-found">
      <!-- "4 [ninja] 4": the ninja's head is the zero -->
      <div class="not-found-art d-flex align-items-center justify-content-center mb-4" role="img"
           aria-label="404, with the zero drawn as a masked ninja peeking out from a puff of smoke">
        <span class="not-found-digit" aria-hidden="true">4</span>
        <svg class="not-found-ninja" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <!-- smoke puffs -->
          <g class="ninja-smoke">
            <circle cx="40" cy="160" r="26"/>
            <circle cx="75" cy="175" r="22"/>
            <circle cx="125" cy="176" r="24"/>
            <circle cx="162" cy="158" r="26"/>
            <circle cx="100" cy="182" r="18"/>
          </g>
          <!-- glow behind the head so it stands out in dark mode too -->
          <circle class="ninja-halo" cx="100" cy="100" r="80"/>
          <!-- headband tails, flapping off to the right -->
          <g class="ninja-tails">
            <path d="M158 78 C182 70 192 56 196 42 C184 54 172 60 156 64 Z" fill="#dc3545"/>
            <path d="M158 86 C184 88 196 80 200 70 C186 78 172 80 157 76 Z" fill="#b02a37"/>
          </g>
          <!-- head -->
          <circle cx="100" cy="100" r="70" fill="#22263a"/>
          <!-- headband -->
          <path d="M33 74 Q100 54 167 74 L165 88 Q100 70 35 88 Z" fill="#dc3545"/>
          <circle cx="161" cy="80" r="7" fill="#b02a37"/>
          <!-- eye slit -->
          <rect x="44" y="94" width="112" height="32" rx="16" fill="#f3cfa6"/>
          <!-- eyes, glancing sideways -->
          <g class="ninja-eyes">
            <ellipse cx="80" cy="110" rx="8" ry="9" fill="#22263a"/>
            <ellipse cx="122" cy="110" rx="8" ry="9" fill="#22263a"/>
            <circle cx="83" cy="107" r="2.5" fill="#fff"/>
            <circle cx="125" cy="107" r="2.5" fill="#fff"/>
          </g>
          <!-- suspicious eyebrows -->
          <path d="M68 99 L92 103" stroke="#22263a" stroke-width="4" stroke-linecap="round"/>
          <path d="M110 103 L134 99" stroke="#22263a" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="not-found-digit" aria-hidden="true">4</span>
      </div>

      <span class="badge rounded-pill text-bg-warning mb-3"><i class="bi bi-eye-slash me-1"></i>Error 404</span>
      <h1 class="display-6 fw-bold mb-3">This page has gone full ninja.</h1>
      <p class="lead text-body-secondary mx-auto mb-4" style="max-width: 34rem;">
        It slipped into the shadows and left no trace. Either it never existed, or it's very, very good at hiding.
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <a class="btn btn-primary btn-lg" href="/"><i class="bi bi-house-door me-1"></i>Back to the blog</a>
        <a class="btn btn-lg border text-body" href="/about"><i class="bi bi-info-circle me-1"></i>About Shinobi</a>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white-50 py-3 mt-5">
    <div class="container text-center small">Shinobi &middot; built with Bootstrap 5</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/user.js"></script>
</body>
</html>
